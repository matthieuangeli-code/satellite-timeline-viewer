name: Deploy SaaS landing (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier l'accès HTTP au site et à la démo
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://matthieuangeli-code.github.io/satellite-timeline-viewer"
          for path in "/" "/demo.html"; do
            url="${BASE}${path}"
            echo "Testing ${url}"
            curl -fLsS --retry 10 --retry-all-errors --retry-delay 6                  --connect-timeout 8 --max-time 20 "${url}" > /tmp/landing.html
            grep -q 'SiteHistory' /tmp/landing.html
            echo "HTTP OK: ${url}"
          done
