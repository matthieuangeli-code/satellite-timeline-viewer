name: Verify hosted sandbox backend
on:
  pull_request:
    paths:
      - ".github/workflows/backend-smoke.yml"
      - "scripts/smoke-backend.mjs"
      - "scripts/smoke-sitehistory.mjs"
      - "docs/assets/config.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend-smoke.yml"
      - "scripts/smoke-backend.mjs"
      - "scripts/smoke-sitehistory.mjs"
      - "docs/assets/config.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify real hosted API and attempt a real report
        env:
          SITEHISTORY_VERIFY_REPORT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/smoke-backend.mjs
      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify hosted frontend in a real browser
        env:
          SITEHISTORY_BASE_URL: https://sitehistory-api-pilot.onrender.com
          SITEHISTORY_SCREENSHOTS: test-results/backend-browser
          SITEHISTORY_PREVIEW_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/smoke-sitehistory.mjs
      - name: Preserve results without private reports or tokens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-sandbox-checks
          path: test-results/
