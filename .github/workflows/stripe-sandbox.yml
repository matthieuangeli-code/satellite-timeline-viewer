name: Supervised Stripe sandbox delivery
on:
  workflow_dispatch:
    inputs:
      navigation_only:
        description: Open real Stripe TEST Checkout without entering a card or paying
        type: boolean
        default: false
      parcel_id:
        description: Cadastral reference for the navigation-only check
        default: '276440000B0151'
permissions:
  contents: read
  checks: write
concurrency:
  group: sitehistory-stripe-sandbox
  cancel-in-progress: false
jobs:
  sandbox-payment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install verified browser and PDF tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Real TEST payment, secure downloads and supervised restart
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_ONLY: ${{ inputs.navigation_only }}
          SITEHISTORY_PARCEL_ID: ${{ inputs.parcel_id }}
        run: |
          if [ "$CHECKOUT_ONLY" = "true" ]; then
            node scripts/checkout-smoke.mjs
          else
            node scripts/stripe-sandbox-e2e.mjs
          fi
      - name: Preserve audit results without keys, tokens or private reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-sandbox-results
          path: |
            test-results/stripe-sandbox/
            test-results/checkout/
