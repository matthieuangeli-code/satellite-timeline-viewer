name: Validate SiteHistory demo in browser
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo-smoke.yml"
      - "scripts/smoke-sitehistory.mjs"
      - "scripts/delivery-ui.mjs"
      - "docs/demo.html"
      - "docs/index.html"
      - "docs/sources.html"
      - "docs/assets/**"
  pull_request:
    paths:
      - ".github/workflows/demo-smoke.yml"
      - "scripts/smoke-sitehistory.mjs"
      - "scripts/delivery-ui.mjs"
      - "docs/demo.html"
      - "docs/index.html"
      - "docs/sources.html"
      - "docs/assets/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sitehistory-demo-checks
  cancel-in-progress: false
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Serve this checkout
        run: |
          python3 -m http.server 8000 --directory docs > /tmp/sitehistory-http.log 2>&1 &
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8000/demo.html > /dev/null; then break; fi
            sleep 1
          done
      - name: Check delivery recovery with explicit synthetic API fixtures
        run: node scripts/delivery-ui.mjs
      - name: Check SiteHistory against real public APIs in Chromium
        env:
          SITEHISTORY_BASE_URL: http://127.0.0.1:8000
        run: node scripts/smoke-sitehistory.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitehistory-browser-checks
          path: test-results/sitehistory
