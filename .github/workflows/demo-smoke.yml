name: Validate SiteHistory demo in browser
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo-smoke.yml"
      - "scripts/smoke-sitehistory.mjs"
      - "scripts/delivery-ui.mjs"
      - "scripts/preparation-ui.mjs"
      - "scripts/release-site.mjs"
      - "docs/demo.html"
      - "docs/sandbox.html"
      - "docs/index.html"
      - "docs/sources.html"
      - "docs/confidentialite.html"
      - "docs/service.html"
      - "docs/404.html"
      - "docs/sitemap.xml"
      - "docs/assets/**"
  pull_request:
    paths:
      - ".github/workflows/demo-smoke.yml"
      - "scripts/smoke-sitehistory.mjs"
      - "scripts/delivery-ui.mjs"
      - "scripts/preparation-ui.mjs"
      - "scripts/release-site.mjs"
      - "docs/demo.html"
      - "docs/sandbox.html"
      - "docs/index.html"
      - "docs/sources.html"
      - "docs/confidentialite.html"
      - "docs/service.html"
      - "docs/404.html"
      - "docs/sitemap.xml"
      - "docs/assets/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sitehistory-demo-checks
  cancel-in-progress: false
jobs:
  browser-smoke:
    # Playwright 1.56 supports Ubuntu 24.04; latest moved to 26 in October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0 leaflet@1.9.4 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Serve this checkout
        run: |
          python3 -m http.server 8000 --directory docs > /tmp/sitehistory-http.log 2>&1 &
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8000/demo.html > /dev/null; then break; fi
            sleep 1
          done
      - name: Check release navigation, real imagery and accessibility
        run: node scripts/release-site.mjs
      - name: Check delivery recovery with explicit synthetic API fixtures
        run: node scripts/delivery-ui.mjs
      - name: Check preparation feedback and early cadastral search with synthetic fixtures
        run: node scripts/preparation-ui.mjs
      - name: Check SiteHistory against real public APIs in Chromium
        env:
          SITEHISTORY_BASE_URL: http://127.0.0.1:8000
        run: node scripts/smoke-sitehistory.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitehistory-browser-checks
          path: test-results/
